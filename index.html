<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- PARA LA UBICACIÒN -->
    <section class="area-en-blanco"></section>

    <!-- CONTENIDO -->
     <section class="homepage-form">

         <!--BLOQUE DEL TÍTULO -->
         <div class="homepage-form-contenedor">

                 <div class="homepage-form-título">
                    <div class="contenedor-icono">
                        <img src="./imagenes/logo.svg" alt="Logo" class="mi-icono">
                    </div>

                     <h2 class="homepage-form-prompt-titulo">
                         <span>Expresá tu idea.</span>
                         <span>El Agente Hostinger se encarga del resto.</span>
                     </h2>

                 </div>

         </div>

         <!-- INPUT  -->   
         <div class="homepage-form-prompt">

             <form class="homepage-form-controls">

                 <input class="homepage-form-control-input"
                 type="text"
                 placeholder="¿Qué te gustaría crear hoy?">

                <button type="submit">
                    <i class="bi bi-chevron-right"></i>
                </button>
             </form>
             <span>Obtenga un plan de sitio e idea de dominio en menos de un minuto. Gratis, sin registro</span>
         </div>

     </section>

</body>
</html>
